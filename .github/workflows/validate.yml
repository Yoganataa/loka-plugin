name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No brand names in paths or identifiers
        run: python3 tools/check_naming.py
      - name: Validate sources
        run: python3 tools/validate.py
      - name: Build index (dry run)
        run: python3 tools/build_index.py https://yoganataa.github.io/loka-plugin --out dist
